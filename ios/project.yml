name: TourGuide
options:
  bundleIdPrefix: com.yourorg
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

schemes:
  TourGuide:
    build:
      targets:
        TourGuide: all
    run:
      config: Debug
    test:
      config: Debug

targets:
  TourGuide:
    type: application
    platform: iOS
    sources:
      - TourGuide
    # Associated Domains for the DAT Universal Link handshake (requires the PAID
    # Apple Developer Program — enabled now that the account is active).
    entitlements:
      path: TourGuide/Resources/TourGuide.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:saurinjhaveri.github.io
    # Full Info.plist is generated from here so permissions can't be dropped.
    # API keys are NOT here — they live in Secrets.plist (read by Config.swift).
    info:
      path: TourGuide/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tour Guide
        # Expose Documents/TourGuideVault in the Files app so Obsidian can open it.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: "Used to talk to your tour guide hands-free through your glasses."
        NSSpeechRecognitionUsageDescription: "Used to understand what you ask your tour guide (on-device in Lite mode)."
        NSLocationWhenInUseUsageDescription: "Used to identify nearby landmarks and tailor your tour to where you are."
        NSCameraUsageDescription: "Used to capture what you are looking at so the guide can identify it."
        NSBluetoothAlwaysUsageDescription: "Used to connect to your glasses for audio and capture."
        UIBackgroundModes: [audio, bluetooth-peripheral, external-accessory]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad requires all four orientations (or full-screen); silence the warning.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Used to pick a photo to identify when testing without glasses."
        # --- Meta Wearables Device Access Toolkit (needed only for real glasses) ---
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [tourguide]   # must match MWDAT.AppLinkURLScheme
        MWDAT:
          AppLinkURLScheme: tourguide
          MetaAppID: "YOUR_META_APP_ID"       # from your Meta developer app registration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saurin.tourguide
        SWIFT_VERSION: "5.0"   # Swift 5 language mode; adopt Swift 6 concurrency later
        TARGETED_DEVICE_FAMILY: "1,2"
        # DEVELOPMENT_TEAM: ABCDE12345   # <- set your Apple Team ID (needed to run on real glasses/device)
    # Meta DAT SDK — adding this makes `canImport(MWDATCore)` true, so
    # MetaDATGlassesProvider's real implementation activates automatically.
    # The package + MWDATMockDevice work without approval (simulated Ray-Ban);
    # linking REAL glasses also needs DAT preview approval + MWDAT.MetaAppID above.
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATMockDevice

# Swift packages (top-level key, sibling of `targets`).
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: 0.7.0
