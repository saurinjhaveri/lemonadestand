name: TourGuide
options:
  bundleIdPrefix: com.yourorg
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

schemes:
  TourGuide:
    build:
      targets:
        TourGuide: all
    run:
      config: Debug
    test:
      config: Debug

targets:
  TourGuide:
    type: application
    platform: iOS
    # Apply the git-ignored secrets xcconfig (defines OPENAI_API_KEY etc.).
    # Run once: cp TourGuide/Config/Secrets.example.xcconfig TourGuide/Config/Secrets.xcconfig
    configFiles:
      Debug: TourGuide/Config/Secrets.xcconfig
      Release: TourGuide/Config/Secrets.xcconfig
    sources:
      - TourGuide
    info:
      path: TourGuide/Resources/Info.plist
      properties:
        # Surface build-setting secrets into the bundle for Config.swift.
        OpenAIAPIKey: $(OPENAI_API_KEY)
        GooglePlacesAPIKey: $(GOOGLE_PLACES_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourorg.tourguide
        SWIFT_VERSION: "5.0"   # Swift 5 language mode; adopt Swift 6 concurrency later
        TARGETED_DEVICE_FAMILY: "1,2"
        # DEVELOPMENT_TEAM: ABCDE12345   # <- set your Apple Team ID
