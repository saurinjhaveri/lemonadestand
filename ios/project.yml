name: TourGuide
options:
  bundleIdPrefix: com.yourorg
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

schemes:
  TourGuide:
    build:
      targets:
        TourGuide: all
    run:
      config: Debug
    test:
      config: Debug

targets:
  TourGuide:
    type: application
    platform: iOS
    sources:
      - TourGuide
    # Full Info.plist is generated from here so permissions can't be dropped.
    # API keys are NOT here — they live in Secrets.plist (read by Config.swift).
    info:
      path: TourGuide/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tour Guide
        NSMicrophoneUsageDescription: "Used to talk to your tour guide hands-free through your glasses."
        NSLocationWhenInUseUsageDescription: "Used to identify nearby landmarks and tailor your tour to where you are."
        NSCameraUsageDescription: "Used to capture what you are looking at so the guide can identify it."
        NSBluetoothAlwaysUsageDescription: "Used to connect to your glasses for audio and capture."
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourorg.tourguide
        SWIFT_VERSION: "5.0"   # Swift 5 language mode; adopt Swift 6 concurrency later
        TARGETED_DEVICE_FAMILY: "1,2"
        # DEVELOPMENT_TEAM: ABCDE12345   # <- set your Apple Team ID
