name: DATTest
options:
  bundleIdPrefix: com.saurin
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

schemes:
  DATTest:
    build:
      targets:
        DATTest: all
    run:
      config: Debug

targets:
  DATTest:
    type: application
    platform: iOS
    sources:
      - DATTest
    # Needed so iOS routes the registration RETURN universal link
    # (https://saurinjhaveri.github.io/...) back to this app. Requires paid Apple
    # account + the AASA hosted on that domain.
    entitlements:
      path: DATTest/DATTest.entitlements
      properties:
        com.apple.developer.associated-domains:
          # ?mode=developer makes iOS fetch the AASA directly from the domain
          # (bypasses Apple's CDN cache) — needed while the file is freshly hosted.
          # Requires Settings ▸ Developer ▸ Associated Domains Development = ON.
          - applinks:saurinjhaveri.github.io?mode=developer
    info:
      path: DATTest/Info.plist
      properties:
        CFBundleDisplayName: DAT Test
        NSCameraUsageDescription: "Used to capture from the glasses camera."
        NSBluetoothAlwaysUsageDescription: "Used to connect to your glasses."
        NSLocationWhenInUseUsageDescription: "Used by the toolkit."
        UIBackgroundModes: [audio, bluetooth-peripheral, external-accessory]
        UILaunchScreen: {}
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [tourguide]
        MWDAT:
          AppLinkURLScheme: tourguide
          # Developer Mode: do NOT set MetaAppID.
    settings:
      base:
        # Same bundle id as the main app so Developer Mode trust carries over.
        PRODUCT_BUNDLE_IDENTIFIER: com.saurin.tourguide
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 5P57QNRV6C
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATMockDevice

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: 0.7.0
