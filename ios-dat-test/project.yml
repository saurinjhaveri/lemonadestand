name: DATTest
options:
  bundleIdPrefix: com.saurin
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

schemes:
  DATTest:
    build:
      targets:
        DATTest: all
    run:
      config: Debug

targets:
  DATTest:
    type: application
    platform: iOS
    sources:
      - DATTest
    info:
      path: DATTest/Info.plist
      properties:
        CFBundleDisplayName: DAT Test
        NSCameraUsageDescription: "Used to capture from the glasses camera."
        NSBluetoothAlwaysUsageDescription: "Used to connect to your glasses."
        NSLocationWhenInUseUsageDescription: "Used by the toolkit."
        UIBackgroundModes: [audio, bluetooth-peripheral, external-accessory]
        UILaunchScreen: {}
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [tourguide]
        MWDAT:
          AppLinkURLScheme: tourguide
          # Developer Mode: do NOT set MetaAppID.
    settings:
      base:
        # Same bundle id as the main app so Developer Mode trust carries over.
        PRODUCT_BUNDLE_IDENTIFIER: com.saurin.tourguide
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # DEVELOPMENT_TEAM: ABCDE12345   # <- set your Apple Team ID before building to device
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATMockDevice

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: 0.7.0
