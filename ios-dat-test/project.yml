name: DATTest
options:
  bundleIdPrefix: com.saurin
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

schemes:
  DATTest:
    build:
      targets:
        DATTest: all
    run:
      config: Debug

targets:
  DATTest:
    type: application
    platform: iOS
    sources:
      - DATTest
    # Entitlements per Meta's official CameraAccess sample (keychain group for
    # the SDK's registration record; Wi-Fi entitlements for the glasses' data
    # transfer). The registration callback is a CUSTOM SCHEME, not a universal
    # link, so no Associated Domains are needed.
    entitlements:
      path: DATTest/DATTest.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.developer.networking.wifi-info: true
        com.apple.developer.networking.HotspotConfiguration: true
    info:
      path: DATTest/Info.plist
      properties:
        CFBundleDisplayName: DAT Test
        NSCameraUsageDescription: "Used to capture from the glasses camera."
        NSBluetoothAlwaysUsageDescription: "Needed to connect to Meta AI Glasses"
        NSLocalNetworkUsageDescription: "This allows your phone to find and connect to your glasses over Wi-Fi."
        NSLocationWhenInUseUsageDescription: "Used by the toolkit."
        # Required for local-network discovery — without the Bonjour services
        # list, iOS silently blocks the glasses' Wi-Fi transfer (official sample).
        NSBonjourServices: [_bonjour._tcp]
        # Lets the SDK detect + open the Meta AI app via canOpenURL (AGENTS.md).
        LSApplicationQueriesSchemes: [fb-viewapp]
        # Background modes per the official CameraAccess sample.
        UIBackgroundModes: [processing, bluetooth-central, bluetooth-peripheral]
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes: [tourguide]
        MWDAT:
          # MUST include '://' — Meta AI builds the registration callback from
          # this exact string (official sample uses "cameraaccess://").
          AppLinkURLScheme: "tourguide://"
          # Developer Mode uses MetaAppID "0" (per Meta's plugin docs), not absent.
          MetaAppID: "0"
    settings:
      base:
        # Same bundle id as the main app so Developer Mode trust carries over.
        PRODUCT_BUNDLE_IDENTIFIER: com.saurin.tourguide
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 5P57QNRV6C
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATMockDevice

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: 0.7.0
